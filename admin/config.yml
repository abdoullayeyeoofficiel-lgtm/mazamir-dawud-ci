backend:
  name: github
  repo: abdoulayeyeofficial-lgtm/mazamir-dawud-ci
  branch: main

media_folder: "images"
public_folder: "/images"

locale: fr

collections:
  - name: "parametres"
    label: "⚙️ Paramètres généraux"
    files:
      - name: "parametres"
        label: "Contacts & Réseaux"
        file: "content/parametres.json"
        fields:
          - { label: "Nom", name: "nom", widget: "string" }
          - { label: "Téléphone / WhatsApp", name: "telephone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Adresse", name: "adresse", widget: "string" }
          - { label: "Facebook", name: "facebook", widget: "string", required: false }
          - { label: "TikTok", name: "tiktok", widget: "string", required: false }
          - { label: "YouTube", name: "youtube", widget: "string", required: false }

  - name: "laureats"
    label: "🏆 Lauréats"
    files:
      - name: "laureats"
        label: "Liste des lauréats"
        file: "content/laureats.json"
        fields:
          - label: "Lauréats"
            name: "items"
            widget: "list"
            fields:
              - { label: "Nom", name: "nom", widget: "string" }
              - { label: "Édition", name: "edition", widget: "string" }
              - { label: "Photo (URL)", name: "photo", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
